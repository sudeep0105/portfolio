<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Card with Gradient Border -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg-grad)" stroke="url(#cyan-violet)" stroke-width="14" />
  
  <!-- Ambient Inner Glow -->
  <circle cx="256" cy="256" r="160" fill="#00f2fe" opacity="0.08" filter="url(#glow)" />
  
  <!-- Code Brackets < > -->
  <path d="M 130 186 L 75 256 L 130 326" fill="none" stroke="#00f2fe" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 382 186 L 437 256 L 382 326" fill="none" stroke="#a855f7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Monogram Text KVS -->
  <text x="256" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" letter-spacing="2" fill="url(#cyan-violet)" text-anchor="middle">KVS</text>
  
  <!-- Accent Pulse Dot -->
  <circle cx="360" cy="150" r="14" fill="#00f2fe" />
</svg>
